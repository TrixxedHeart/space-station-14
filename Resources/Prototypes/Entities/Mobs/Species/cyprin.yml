- type: entity
  parent: BaseMobSpeciesOrganic
  id: BaseMobCyprin
  name: Cyprin
  abstract: true
  components:
  - type: Hunger
  - type: Icon
    sprite: Mobs/Species/Cyprin/parts.rsi
    state: full
  - type: Thirst
  - type: Body
    prototype: Cyprin
    requiredLegs: 2
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatCyprin
      amount: 5
  - type: HumanoidAppearance
    species: Cyprin
    hideLayersOnEquip:
    - Hair
    markingOffsets:
      Hair: "0, 0.03"
  - type: Inventory
    templateId: cyprin
    speciesId: cyprin
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Cyprin/displacement.rsi
            state: jumpsuit
      ears:
        sizeMaps:
          32:
            sprite: Mobs/Species/Cyprin/displacement.rsi
            state: ears
      outerClothing:
        sizeMaps:
          32:
            sprite: Mobs/Species/Cyprin/displacement.rsi
            state: outerwear
      shoes:
        sizeMaps:
          32:
            sprite: Mobs/Species/Cyprin/displacement.rsi
            state: shoes
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Cyprin
  - type: Bloodstream
    BloodMaxVolume: 200
    bloodReagent: LuminalBrine
  - type: Sprite # Drawlayers. Top to bottom in order I believe.
    netsync: false
    layers:
    - map: [ "enum.HumanoidVisualLayers.Chest" ]
    - map: [ "enum.HumanoidVisualLayers.Head" ]
    - map: [ "enum.HumanoidVisualLayers.Snout" ]
    - map: [ "enum.HumanoidVisualLayers.Eyes" ]
    - map: [ "enum.HumanoidVisualLayers.RArm" ]
    - map: [ "enum.HumanoidVisualLayers.LArm" ]
    - map: [ "enum.HumanoidVisualLayers.RLeg" ]
    - map: [ "enum.HumanoidVisualLayers.LLeg" ]
    - map: [ "enum.HumanoidVisualLayers.Tail" ]
    - map: [ "enum.HumanoidVisualLayers.UndergarmentBottom" ]
    - map: [ "enum.HumanoidVisualLayers.UndergarmentTop" ]
    - map: [ "jumpsuit" ]
    - map: [ "enum.HumanoidVisualLayers.LHand" ]
    - map: [ "enum.HumanoidVisualLayers.RHand" ]
    - map: [ "enum.HumanoidVisualLayers.LFoot" ]
    - map: [ "enum.HumanoidVisualLayers.RFoot" ]
    - map: [ "enum.HumanoidVisualLayers.Handcuffs" ]
      color: "#ffffff"
      sprite: Objects/Misc/handcuffs.rsi
      state: body-overlay-2
      visible: false
    - map: [ "id" ]
    - map: [ "gloves" ]
    - map: [ "shoes" ]
    - map: [ "ears" ]
    - map: [ "outerClothing" ]
    - map: [ "eyes" ]
    - map: [ "belt" ]
    - map: [ "neck" ]
    - map: [ "back" ]
