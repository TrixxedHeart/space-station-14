- type: entity
  id: PartCyprin
  parent: [BaseItem, BasePart]
  name: "Cyprin body part"
  abstract: true
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10

- type: entity
  id: TorsoCyprin
  name: "Cyprin torso"
  parent: [PartCyprin, BaseTorso]
  components:
  - type: Sprite
    sprite: Mobs/Species/Cyprin/parts.rsi
    state: "torso"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 20

- type: entity
