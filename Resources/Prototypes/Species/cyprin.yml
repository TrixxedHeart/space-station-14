- type: species
  id: Cyprin
  name: species-name-cyprin
  roundStart: true
  prototype: MobCyprin
  sprites: MobCyprinSprites
  markingLimits: MobCyprinMarkingLimits
  dollPrototype: MobCyprinDummy
  skinColoration: Hues
  sexes:
  - Unsexed

- type: speciesBaseSprites
  id: MobCyprinSprites
  sprites:
    Special: MobHumanoidAnyMarking
    Head: MobCyprinHead
    Hair: MobHumanoidAnyMarking
    FacialHair: MobHumanoidAnyMarking
    Snout: MobHumanoidAnyMarking
    UndergarmentTop: MobHumanoidAnyMarking
    UndergarmentBottom: MobHumanoidAnyMarking
    Chest: MobCyprinTorso
    Eyes: MobCyprinEyes
    HeadTop: MobHumanoidAnyMarking
    LArm: MobCyprinLArm
    RArm: MobCyprinRArm
    LHand: MobCyprinLHand
