    LFoot: MobCyprinLFoot
    RFoot: MobCyprinRFoot
    Tail: MobHumanoidAnyMarking

- type: markingPoints
  id: MobCyprinMarkingLimits
  points:
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 0
      required: false
      onlyWhitelisted: false
    Head:
      points: 1
      required: true
    HeadSide:
      points: 1
      required: true
      defaultMarkings: [ CyprinHeadFins ]
    Arms:
      points: 4
      required: true
    Legs:
      points: 4
      required: true
    UndergarmentTop:
      points: 1
      required: false
    UndergarmentBottom:
      points: 1
      required: false
    Chest:
      points: 2
      required: false
    Tail:
      points: 1
      required: true
      defaultMarkings: [ CyprinTail ]

